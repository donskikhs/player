<style>
:root{--bg:#0E0F12;--bg2:#131418;--card:#15161A;--line:#23252B;--text:#ECEDEF;--muted:#A9ADB6;--dim:#8A8E98;--accent:#FFB547;--accent2:#FFD08A;
--sans:Inter,'Noto Sans SC','Noto Sans JP',system-ui,sans-serif;--display:Unbounded,'Noto Sans SC','Noto Sans JP',sans-serif;--mono:'JetBrains Mono','Noto Sans SC','Noto Sans JP',monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;overflow-x:hidden}
a{color:var(--accent)}a:hover{color:var(--accent2)}

h2{font-weight:700;font-size:clamp(26px,3.4vw,44px);line-height:1.15}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:12px;min-height:44px;border-radius:12px;text-decoration:none;font-weight:600}
.btn-primary{background:var(--accent);color:var(--bg)}.btn-primary:hover{background:var(--accent2);color:var(--bg)}
.btn-ghost{border:1px solid #3A3D45;color:var(--text);font-weight:500}.btn-ghost:hover{border-color:var(--dim);color:var(--text)}
.icon-btn{background:var(--card);border:1px solid #2E3038;color:var(--text);border-radius:10px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
header{border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:rgba(14,15,18,.92);backdrop-filter:blur(10px)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px}
.nav-links{display:flex;align-items:center;gap:26px;font-size:15px;padding-right:10px}
.nav-links a{color:#C5C8CF;text-decoration:none;white-space:nowrap}.nav-links a:hover{color:var(--text)}

.lang-item{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:8px;border:0;font-size:14px;text-align:left;background:transparent;color:var(--text)}
.lang-item:hover{background:#22242A}
.lang-item[aria-checked="true"]{background:var(--accent);color:var(--bg);font-weight:600}
.mobile-menu{display:none;flex-direction:column;padding:8px 20px 20px;gap:4px;border-top:1px solid var(--line)}
.mobile-menu a.item{color:var(--text);text-decoration:none;font-size:17px;padding:12px 4px;min-height:44px;border-bottom:1px solid #1E2025}
.hero{display:flex;flex-wrap:wrap;gap:56px;align-items:center;padding-top:88px;padding-bottom:72px}
.hero-text{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:26px}
.hero h1{font-weight:800;font-size:clamp(34px,5.4vw,72px);line-height:1.05;letter-spacing:-.02em;overflow-wrap:anywhere}
.hero h1 span{display:block}.hero h1 span+span{color:var(--accent)}
.player{flex:1 1 480px;min-width:0;background:#17181D;border:1px solid #2A2C33;border-radius:18px;overflow:hidden}
.grid{display:grid;gap:16px}
.features{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:14px;text-decoration:none;color:var(--text);transition:border-color .2s,transform .2s}
.card:hover{border-color:#3A3D45;color:var(--text);transform:translateY(-2px)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:5px}
.tab{border:0;border-radius:8px;padding:0 18px;min-height:44px;font-size:15px;font-weight:500;background:transparent;color:var(--muted)}

.steps{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:28px 20px}
.step{border-top:2px solid var(--accent);padding-top:20px;display:flex;flex-direction:column;gap:10px}
.gbtn{text-align:left;border:0;font-size:15px;padding:10px 14px;min-height:44px;border-radius:10px;background:transparent;color:var(--muted)}
.gbtn:hover{color:var(--text)}
.gbtn[aria-current="true"]{background:#1C1D22;color:var(--text)}
.kbd{font-family:var(--mono);font-size:13px;background:#1C1D22;border:1px solid #2E3038;border-radius:7px;padding:4px 10px;white-space:nowrap;flex:none}
.faq-q{width:100%;background:none;border:0;color:var(--text);font-size:17px;font-weight:500;text-align:left;padding:20px 0;min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.tlink{min-height:44px;display:inline-flex;align-items:center}
@media (max-width:960px){
.nav-links,.hide-md{display:none !important}
.burger{display:inline-flex !important}
.mobile-menu.open{display:flex}
}
@media (max-width:640px){
.sec{padding-top:56px;padding-bottom:56px}
.hero{padding-top:48px;padding-bottom:48px;gap:36px}
.hide-xs{display:none !important}
.card{padding:20px}
.btn-lg{width:100%;justify-content:center}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}}

var I18N = {
ru: {"name":"Русский","code":"RU","nav":["Функции","Установка","Гайд","Версии","FAQ"],"dl":"Скачать","menu":"Меню","lang":"Язык","ver":"Версия","relDate":"ДАТА РЕЛИЗА","h1a":"Просто слушай.","h1b":"Без лишнего.","sub":"DONSKIKH Media Player — профессиональный DJ-плеер для macOS: медиатека, два дека, Automix, waveform, BPM, тональность, эквалайзер и Smart Playlists.","other":"Как установить","size":"7.5 MB","free":"Бесплатно","subs":"Сейчас играет","playlist":"Плейлист","fTitle":"Что умеет плеер","fSub":"Каждая карточка ведёт в раздел гайда с подробным описанием.","f":[["Все популярные форматы","MP3, FLAC, WAV, AIFF, AAC, M4A, ALAC и CAF; поддержку каждого формата проверяем отдельными тестами."],["Плейлисты","Перетащите папку — плеер соберёт очередь. Сохранение и повтор."],["Обложки и теги","Обложки альбомов, исполнитель, название и год трека."],["Эквалайзер","14 пресетов и ручная настройка звука с защитой от перегрузки."],["Медиаклавиши Mac","Управление воспроизведением с системных клавиш macOS."],["Горячие клавиши","Всё управление — с клавиатуры. Список в гайде."]],"iTitle":"Установка за минуту","steps":[["Скачайте .dmg","Нажмите «Скачать для macOS» — загрузится файл .dmg."],["Перенесите в Программы","Перетащите значок плеера в папку «Программы»."],["Первый запуск","Откройте плеер. Если macOS не даёт: Системные настройки → Конфиденциальность и безопасность → «Всё равно открыть». Это нужно один раз."],["Готово","Плеер появится в Launchpad."]],"req":"Требования","checksum":"1329d0850b7c3fc3ccf538cbb0c02d2f49366d32c5ee327046676ddb4a184b4e","reqv":"macOS 14+","gMenu":["Первый запуск","Открытие файлов и папок","Плейлисты","Обложки и теги","Эквалайзер и звук","Горячие клавиши","Настройки и темы","Решение проблем"],"gP":"После установки откройте плеер из Launchpad или папки «Программы». Добавьте файлы или папки перетаскиванием: медиатека обновится автоматически. Для диджеинга доступны два дека, Automix, BPM, тональность, Camelot, waveform, 30-полосный EQ и Smart Playlists.","gTip":"Подсказка: перетаскивайте папки из Finder прямо в окно плеера. Если при первом запуске macOS блокирует плеер — «Всё равно открыть» в настройках конфиденциальности.","kTitle":"Горячие клавиши","k":[["Пауза / воспроизведение","Пробел"],["Перемотка на 5 секунд","← / →"],["Громкость","↑ / ↓"],["Перемешать","S"],["Следующий трек","N"],["Открыть файл","⌘ + O"]],"cTitle":"История обновлений","current":"Актуальная","added":"Обновления прямо из плеера, hot cue и петли, экспорт в Rekordbox и Serato DJ","fixed":"Перетаскивание в Finder копирует файл; звук 5.1/7.1; перемешивание; редкие падения","prev":"Smart Playlist корректно обрабатывает кириллицу, %, _, \\ и NULL; targeted 6/6, полный Debug 386/386","archive":"Архив","qTitle":"Частые вопросы","q":[["Плеер бесплатный?","Да. Плеер бесплатный. Он подписан без сертификата Apple Developer ID, поэтому при первом запуске macOS один раз просит подтвердить открытие."],["Какие форматы поддерживаются?","MP3, FLAC, WAV, AIFF, AAC, M4A (AAC и ALAC), CAF, W64, M4B, звук из видео MP4 и MOV, а также CUE-образы."],["Как обновиться до новой версии?","Плеер сам проверяет обновления и показывает, что нового: нажмите «Скачать и установить», затем замените приложение в «Программах». Медиатека и настройки сохранятся."],["macOS пишет, что разработчик не подтверждён — что делать?","Откройте Системные настройки → Конфиденциальность и безопасность, внизу нажмите «Всё равно открыть» и подтвердите паролем. Если macOS пишет, что приложение повреждено, выполните в Терминале: xattr -dr com.apple.quarantine \"/Applications/DONSKIKH Media Player.app\". Это нужно один раз."]],"report":"Сообщить об ошибке","dlMac":"Скачать для macOS"},
en: {"name":"English","code":"EN","nav":["Features","Install","Guide","Releases","FAQ"],"dl":"Download","menu":"Menu","lang":"Language","ver":"Version","relDate":"RELEASE DATE","h1a":"Just listen.","h1b":"Nothing extra.","sub":"DONSKIKH Media Player is a lightweight music player for macOS. [One line about what makes your player different.]","other":"How to install","size":"7.5 MB","free":"Free","subs":"Now playing","playlist":"Playlist","fTitle":"What the player can do","fSub":"Each card links to a detailed section of the guide.","f":[["All the common formats","See the guide for details."],["Playlists","Drop in a folder and the player builds a queue. Save and repeat."],["Artwork and tags","See the guide for details."],["Equalizer","See the guide for details."],["Mac media keys","See the guide for details."],["Hotkeys","Full keyboard control. The list is in the guide."]],"iTitle":"Install in a minute","steps":[["Download the .dmg","Click “Download for macOS” to get the .dmg file."],["Move to Applications","Drag the player icon into the Applications folder."],["First launch","Open the player. If macOS blocks it: System Settings → Privacy & Security → “Open Anyway”. You only need to do this once."],["Done","The player appears in Launchpad."]],"req":"Requirements","checksum":"1329d0850b7c3fc3ccf538cbb0c02d2f49366d32c5ee327046676ddb4a184b4e","reqv":"macOS 14+","gMenu":["First launch","Opening files and folders","Playlists","Artwork and tags","Equalizer and sound","Hotkeys","Settings and themes","Troubleshooting"],"gP":"After installing, open the player from Launchpad or the Applications folder. Drop a file or folder into the window and the player builds a playlist by itself. [The full text of each guide section goes here.]","gTip":"Tip: drag folders from Finder straight into the player window. If macOS blocks the player on first launch, click “Open Anyway” in Privacy & Security settings.","kTitle":"Hotkeys","k":[["Play / pause","Space"],["Seek 5 seconds","← / →"],["Volume","↑ / ↓"],["Shuffle","S"],["Next track","N"],["Open file","⌘ + O"]],"cTitle":"Release history","current":"Latest","added":"In-app updates, hot cues and loops, export to Rekordbox and Serato DJ","fixed":"Drag to Finder copies the file; 5.1/7.1 audio; shuffle; rare crashes","prev":"See the guide for details.","archive":"Archive","qTitle":"Frequently asked questions","q":[["Is the player free?","Yes, the player is free. It is signed without an Apple Developer ID, so macOS asks you to confirm opening it once."],["Which formats are supported?","MP3, FLAC, WAV, AIFF, AAC, M4A (AAC and ALAC), CAF, W64, M4B, audio from MP4 and MOV video, and CUE images."],["How do I update to a new version?","The player checks for updates itself and shows what’s new: click “Download and Install”, then replace the app in Applications. Your library and settings are kept."],["macOS says the developer can’t be verified — what do I do?","Open System Settings → Privacy & Security, scroll down, click “Open Anyway” and confirm with your password. If macOS says the app is damaged, run in Terminal: xattr -dr com.apple.quarantine \"/Applications/DONSKIKH Media Player.app\". You only need to do this once."]],"report":"Report a bug","dlMac":"Download for macOS"},
es: {"name":"Español","code":"ES","nav":["Funciones","Instalación","Guía","Versiones","FAQ"],"dl":"Descargar","menu":"Menú","lang":"Idioma","ver":"Versión","relDate":"FECHA DE LANZAMIENTO","h1a":"Solo escucha.","h1b":"Sin nada de más.","sub":"DONSKIKH Media Player es un reproductor de música ligero para macOS. [Una frase sobre lo que hace único a tu reproductor.]","other":"Cómo instalar","size":"7.5 MB","free":"Gratis","subs":"Reproduciendo","playlist":"Lista","fTitle":"Qué puede hacer el reproductor","fSub":"Cada tarjeta lleva a una sección detallada de la guía.","f":[["Todos los formatos habituales","See the guide for details."],["Listas de reproducción","Arrastra una carpeta y el reproductor crea la cola. Guardar y repetir."],["Portadas y etiquetas","See the guide for details."],["Ecualizador","See the guide for details."],["Teclas multimedia del Mac","See the guide for details."],["Atajos de teclado","Control total con el teclado. La lista está en la guía."]],"iTitle":"Instalación en un minuto","steps":[["Descarga el .dmg","Pulsa «Descargar para macOS» para obtener el .dmg."],["Mueve a Aplicaciones","Arrastra el icono a la carpeta Aplicaciones."],["Primer inicio","Abre el reproductor. Si macOS lo bloquea: Ajustes del Sistema → Privacidad y seguridad → «Abrir igualmente». Solo hace falta una vez."],["Listo","El reproductor aparece en Launchpad."]],"req":"Requisitos","checksum":"1329d0850b7c3fc3ccf538cbb0c02d2f49366d32c5ee327046676ddb4a184b4e","reqv":"macOS 14+","gMenu":["Primer inicio","Abrir archivos y carpetas","Listas de reproducción","Portadas y etiquetas","Ecualizador y sonido","Atajos de teclado","Ajustes y temas","Solución de problemas"],"gP":"Tras instalarlo, abre el reproductor desde Launchpad o la carpeta Aplicaciones. Arrastra un archivo o carpeta a la ventana y se creará la lista automáticamente. [Aquí irá el texto completo de cada sección.]","gTip":"Consejo: arrastra carpetas desde el Finder directamente a la ventana del reproductor. Si macOS lo bloquea al abrirlo por primera vez, pulsa «Abrir igualmente» en Privacidad y seguridad.","kTitle":"Atajos de teclado","k":[["Reproducir / pausa","Espacio"],["Avanzar 5 segundos","← / →"],["Volumen","↑ / ↓"],["Aleatorio","S"],["Siguiente pista","N"],["Abrir archivo","⌘ + O"]],"cTitle":"Historial de versiones","current":"Actual","added":"Actualizaciones desde el reproductor, hot cues y bucles, exportación a Rekordbox y Serato DJ","fixed":"Arrastrar al Finder copia el archivo; audio 5.1/7.1; aleatorio; fallos poco frecuentes","prev":"See the guide for details.","archive":"Archivo","qTitle":"Preguntas frecuentes","q":[["¿El reproductor es gratuito?","Sí, el reproductor es gratuito. Está firmado sin un Apple Developer ID, por eso macOS pide confirmar la apertura una vez."],["¿Qué formatos admite?","MP3, FLAC, WAV, AIFF, AAC, M4A (AAC y ALAC), CAF, W64, M4B, audio de vídeos MP4 y MOV, e imágenes CUE."],["¿Cómo actualizo a una nueva versión?","El reproductor busca actualizaciones por sí mismo y muestra las novedades: pulsa «Descargar e instalar» y reemplaza la app en Aplicaciones. La biblioteca y los ajustes se conservan."],["macOS dice que no puede verificar al desarrollador, ¿qué hago?","Abre Ajustes del Sistema → Privacidad y seguridad, desplázate hacia abajo, pulsa «Abrir igualmente» y confirma con tu contraseña. Si macOS dice que la app está dañada, ejecuta en Terminal: xattr -dr com.apple.quarantine \"/Applications/DONSKIKH Media Player.app\". Solo hace falta una vez."]],"report":"Informar de un error","dlMac":"Descargar para macOS"},
de: {"name":"Deutsch","code":"DE","nav":["Funktionen","Installation","Anleitung","Versionen","FAQ"],"dl":"Herunterladen","menu":"Menü","lang":"Sprache","ver":"Version","relDate":"RELEASE-DATUM","h1a":"Einfach hören.","h1b":"Ohne Ballast.","sub":"DONSKIKH Media Player ist ein schlanker Musikplayer für macOS. [Ein Satz darüber, was Ihren Player besonders macht.]","other":"So installieren","size":"7.5 MB","free":"Kostenlos","subs":"Läuft gerade","playlist":"Playlist","fTitle":"Was der Player kann","fSub":"Jede Karte führt zu einem ausführlichen Abschnitt der Anleitung.","f":[["Alle gängigen Formate","See the guide for details."],["Playlists","Ordner hineinziehen — der Player baut die Warteschlange. Speichern und wiederholen."],["Cover und Tags","See the guide for details."],["Equalizer","See the guide for details."],["Mac-Medientasten","See the guide for details."],["Tastenkürzel","Volle Steuerung per Tastatur. Liste in der Anleitung."]],"iTitle":"In einer Minute installiert","steps":[[".dmg herunterladen","Auf „Für macOS herunterladen“ klicken — die .dmg wird geladen."],["In Programme ziehen","Das Player-Symbol in den Ordner Programme ziehen."],["Erster Start","Öffne den Player. Wenn macOS ihn blockiert: Systemeinstellungen → Datenschutz & Sicherheit → „Dennoch öffnen“. Das ist nur einmal nötig."],["Fertig","Der Player erscheint im Launchpad."]],"req":"Voraussetzungen","checksum":"1329d0850b7c3fc3ccf538cbb0c02d2f49366d32c5ee327046676ddb4a184b4e","reqv":"macOS 14+","gMenu":["Erster Start","Dateien und Ordner öffnen","Playlists","Cover und Tags","Equalizer und Klang","Tastenkürzel","Einstellungen und Themes","Fehlerbehebung"],"gP":"Nach der Installation den Player über Launchpad oder den Ordner Programme öffnen. Datei oder Ordner ins Fenster ziehen — die Playlist entsteht automatisch. [Hier steht der vollständige Text jedes Abschnitts.]","gTip":"Tipp: Ziehe Ordner aus dem Finder direkt ins Player-Fenster. Blockiert macOS den Player beim ersten Start, klicke in „Datenschutz & Sicherheit“ auf „Dennoch öffnen“.","kTitle":"Tastenkürzel","k":[["Wiedergabe / Pause","Leertaste"],["5 Sekunden spulen","← / →"],["Lautstärke","↑ / ↓"],["Zufallswiedergabe","S"],["Nächster Titel","N"],["Datei öffnen","⌘ + O"]],"cTitle":"Versionsverlauf","current":"Aktuell","added":"Updates direkt im Player, Hot Cues und Loops, Export nach Rekordbox und Serato DJ","fixed":"Ziehen in den Finder kopiert die Datei; 5.1/7.1-Ton; Zufallswiedergabe; seltene Abstürze","prev":"See the guide for details.","archive":"Archiv","qTitle":"Häufige Fragen","q":[["Ist der Player kostenlos?","Ja, der Player ist kostenlos. Er ist ohne Apple Developer ID signiert, daher fragt macOS einmal nach einer Bestätigung zum Öffnen."],["Welche Formate werden unterstützt?","MP3, FLAC, WAV, AIFF, AAC, M4A (AAC und ALAC), CAF, W64, M4B, Ton aus MP4- und MOV-Videos sowie CUE-Images."],["Wie aktualisiere ich auf eine neue Version?","Der Player sucht selbst nach Updates und zeigt die Neuerungen: Klicke auf „Laden und installieren“ und ersetze die App im Ordner „Programme“. Mediathek und Einstellungen bleiben erhalten."],["macOS meldet, der Entwickler sei nicht verifiziert — was tun?","Öffne Systemeinstellungen → Datenschutz & Sicherheit, scrolle nach unten, klicke auf „Dennoch öffnen“ und bestätige mit deinem Passwort. Meldet macOS, die App sei beschädigt, führe im Terminal aus: xattr -dr com.apple.quarantine \"/Applications/DONSKIKH Media Player.app\". Das ist nur einmal nötig."]],"report":"Fehler melden","dlMac":"Für macOS herunterladen"},
fr: {"name":"Français","code":"FR","nav":["Fonctions","Installation","Guide","Versions","FAQ"],"dl":"Télécharger","menu":"Menu","lang":"Langue","ver":"Version","relDate":"DATE DE SORTIE","h1a":"Écoutez, simplement.","h1b":"Sans superflu.","sub":"DONSKIKH Media Player est un lecteur de musique léger pour macOS. [Une phrase sur ce qui distingue votre lecteur.]","other":"Comment installer","size":"7.5 MB","free":"Gratuit","subs":"En cours de lecture","playlist":"Playlist","fTitle":"Ce que fait le lecteur","fSub":"Chaque carte mène à une section détaillée du guide.","f":[["Tous les formats courants","See the guide for details."],["Playlists","Glissez un dossier : le lecteur crée la file. Enregistrer et répéter."],["Pochettes et tags","See the guide for details."],["Égaliseur","See the guide for details."],["Touches multimédia du Mac","See the guide for details."],["Raccourcis clavier","Tout se contrôle au clavier. La liste est dans le guide."]],"iTitle":"Installé en une minute","steps":[["Téléchargez le .dmg","Cliquez sur « Télécharger pour macOS » pour obtenir le .dmg."],["Déplacez dans Applications","Glissez l’icône dans le dossier Applications."],["Premier lancement","Ouvrez le lecteur. Si macOS le bloque : Réglages Système → Confidentialité et sécurité → « Ouvrir quand même ». Une seule fois suffit."],["Terminé","Le lecteur apparaît dans le Launchpad."]],"req":"Configuration requise","checksum":"1329d0850b7c3fc3ccf538cbb0c02d2f49366d32c5ee327046676ddb4a184b4e","reqv":"macOS 14+","gMenu":["Premier lancement","Ouvrir fichiers et dossiers","Playlists","Pochettes et tags","Égaliseur et son","Raccourcis clavier","Paramètres et thèmes","Dépannage"],"gP":"Après l’installation, ouvrez le lecteur depuis le Launchpad ou le dossier Applications. Glissez un fichier ou un dossier dans la fenêtre : la playlist se crée toute seule. [Le texte complet de chaque section viendra ici.]","gTip":"Astuce : faites glisser des dossiers depuis le Finder directement dans la fenêtre du lecteur. Si macOS bloque le lecteur au premier lancement, cliquez sur « Ouvrir quand même » dans Confidentialité et sécurité.","kTitle":"Raccourcis clavier","k":[["Lecture / pause","Espace"],["Avancer de 5 secondes","← / →"],["Volume","↑ / ↓"],["Lecture aléatoire","S"],["Morceau suivant","N"],["Ouvrir un fichier","⌘ + O"]],"cTitle":"Historique des versions","current":"Actuelle","added":"Mises à jour dans le lecteur, hot cues et boucles, export vers Rekordbox et Serato DJ","fixed":"Glisser vers le Finder copie le fichier ; son 5.1/7.1 ; lecture aléatoire ; plantages rares","prev":"See the guide for details.","archive":"Archives","qTitle":"Questions fréquentes","q":[["Le lecteur est-il gratuit ?","Oui, le lecteur est gratuit. Il est signé sans Apple Developer ID : macOS demande donc une fois de confirmer son ouverture."],["Quels formats sont pris en charge ?","MP3, FLAC, WAV, AIFF, AAC, M4A (AAC et ALAC), CAF, W64, M4B, le son des vidéos MP4 et MOV, et les images CUE."],["Comment passer à une nouvelle version ?","Le lecteur recherche lui-même les mises à jour et affiche les nouveautés : cliquez sur « Télécharger et installer », puis remplacez l’app dans Applications. La bibliothèque et les réglages sont conservés."],["macOS indique que le développeur n’est pas vérifié, que faire ?","Ouvrez Réglages Système → Confidentialité et sécurité, faites défiler, cliquez sur « Ouvrir quand même » et confirmez avec votre mot de passe. Si macOS indique que l’app est endommagée, exécutez dans le Terminal : xattr -dr com.apple.quarantine \"/Applications/DONSKIKH Media Player.app\". Une seule fois suffit."]],"report":"Signaler un bug","dlMac":"Télécharger pour macOS"},
pt: {"name":"Português","code":"PT","nav":["Recursos","Instalação","Guia","Versões","FAQ"],"dl":"Baixar","menu":"Menu","lang":"Idioma","ver":"Versão","relDate":"DATA DE LANÇAMENTO","h1a":"Apenas ouça.","h1b":"Sem excessos.","sub":"DONSKIKH Media Player é um player de música leve para macOS. [Uma frase sobre o que torna seu player diferente.]","other":"Como instalar","size":"7.5 MB","free":"Grátis","subs":"Tocando agora","playlist":"Playlist","fTitle":"O que o player faz","fSub":"Cada cartão leva a uma seção detalhada do guia.","f":[["Todos os formatos populares","See the guide for details."],["Playlists","Arraste uma pasta e o player monta a fila. Salvar e repetir."],["Capas e tags","See the guide for details."],["Equalizador","See the guide for details."],["Teclas de mídia do Mac","See the guide for details."],["Atalhos de teclado","Controle total pelo teclado. A lista está no guia."]],"iTitle":"Instalação em um minuto","steps":[["Baixe o .dmg","Clique em “Baixar para macOS” para obter o .dmg."],["Mova para Aplicativos","Arraste o ícone para a pasta Aplicativos."],["Primeira execução","Abra o player. Se o macOS bloquear: Ajustes do Sistema → Privacidade e Segurança → “Abrir Mesmo Assim”. Basta fazer isso uma vez."],["Pronto","O player aparece no Launchpad."]],"req":"Requisitos","checksum":"1329d0850b7c3fc3ccf538cbb0c02d2f49366d32c5ee327046676ddb4a184b4e","reqv":"macOS 14+","gMenu":["Primeira execução","Abrir arquivos e pastas","Playlists","Capas e tags","Equalizador e som","Atalhos de teclado","Configurações e temas","Solução de problemas"],"gP":"Após instalar, abra o player pelo Launchpad ou pela pasta Aplicativos. Arraste um arquivo ou pasta para a janela e a playlist é criada sozinha. [Aqui entrará o texto completo de cada seção.]","gTip":"Dica: arraste pastas do Finder direto para a janela do player. Se o macOS bloquear o player na primeira abertura, clique em “Abrir Mesmo Assim” em Privacidade e Segurança.","kTitle":"Atalhos de teclado","k":[["Reproduzir / pausar","Espaço"],["Avançar 5 segundos","← / →"],["Volume","↑ / ↓"],["Aleatório","S"],["Próxima faixa","N"],["Abrir arquivo","⌘ + O"]],"cTitle":"Histórico de versões","current":"Atual","added":"Atualizações no próprio player, hot cues e loops, exportação para Rekordbox e Serato DJ","fixed":"Arrastar para o Finder copia o arquivo; áudio 5.1/7.1; aleatório; falhas raras","prev":"See the guide for details.","archive":"Arquivo","qTitle":"Perguntas frequentes","q":[["O player é gratuito?","Sim, o player é gratuito. Ele é assinado sem um Apple Developer ID, por isso o macOS pede uma vez para confirmar a abertura."],["Quais formatos são suportados?","MP3, FLAC, WAV, AIFF, AAC, M4A (AAC e ALAC), CAF, W64, M4B, áudio de vídeos MP4 e MOV e imagens CUE."],["Como atualizo para uma nova versão?","O player verifica atualizações sozinho e mostra as novidades: clique em “Baixar e instalar” e substitua o app em Aplicativos. A biblioteca e os ajustes são mantidos."],["O macOS diz que o desenvolvedor não foi verificado, e agora?","Abra Ajustes do Sistema → Privacidade e Segurança, role para baixo, clique em “Abrir Mesmo Assim” e confirme com sua senha. Se o macOS disser que o app está danificado, execute no Terminal: xattr -dr com.apple.quarantine \"/Applications/DONSKIKH Media Player.app\". Basta fazer isso uma vez."]],"report":"Relatar um erro","dlMac":"Baixar para macOS"},
it: {"name":"Italiano","code":"IT","nav":["Funzioni","Installazione","Guida","Versioni","FAQ"],"dl":"Scarica","menu":"Menu","lang":"Lingua","ver":"Versione","relDate":"DATA DI RILASCIO","h1a":"Ascolta e basta.","h1b":"Niente di superfluo.","sub":"DONSKIKH Media Player è un lettore musicale leggero per macOS. [Una frase su ciò che rende unico il tuo lettore.]","other":"Come installare","size":"7.5 MB","free":"Gratis","subs":"In riproduzione","playlist":"Playlist","fTitle":"Cosa sa fare il lettore","fSub":"Ogni scheda porta a una sezione dettagliata della guida.","f":[["Tutti i formati più diffusi","See the guide for details."],["Playlist","Trascina una cartella e il lettore crea la coda. Salva e ripeti."],["Copertine e tag","See the guide for details."],["Equalizzatore","See the guide for details."],["Tasti multimediali del Mac","See the guide for details."],["Scorciatoie da tastiera","Controllo completo da tastiera. L’elenco è nella guida."]],"iTitle":"Installazione in un minuto","steps":[["Scarica il .dmg","Clicca «Scarica per macOS» per ottenere il file .dmg."],["Sposta in Applicazioni","Trascina l’icona nella cartella Applicazioni."],["Primo avvio","Apri il player. Se macOS lo blocca: Impostazioni di Sistema → Privacy e sicurezza → «Apri comunque». Basta farlo una volta."],["Fatto","Il lettore compare nel Launchpad."]],"req":"Requisiti","checksum":"1329d0850b7c3fc3ccf538cbb0c02d2f49366d32c5ee327046676ddb4a184b4e","reqv":"macOS 14+","gMenu":["Primo avvio","Aprire file e cartelle","Playlist","Copertine e tag","Equalizzatore e suono","Scorciatoie da tastiera","Impostazioni e temi","Risoluzione dei problemi"],"gP":"Dopo l’installazione apri il lettore dal Launchpad o dalla cartella Applicazioni. Trascina un file o una cartella nella finestra e la playlist si crea da sola. [Qui andrà il testo completo di ogni sezione.]","gTip":"Suggerimento: trascina le cartelle dal Finder direttamente nella finestra del player. Se macOS blocca il player al primo avvio, fai clic su «Apri comunque» in Privacy e sicurezza.","kTitle":"Scorciatoie da tastiera","k":[["Riproduci / pausa","Spazio"],["Avanza di 5 secondi","← / →"],["Volume","↑ / ↓"],["Riproduzione casuale","S"],["Brano successivo","N"],["Apri file","⌘ + O"]],"cTitle":"Cronologia versioni","current":"Attuale","added":"Aggiornamenti dal player, hot cue e loop, esportazione verso Rekordbox e Serato DJ","fixed":"Trascinare nel Finder copia il file; audio 5.1/7.1; riproduzione casuale; rari arresti","prev":"See the guide for details.","archive":"Archivio","qTitle":"Domande frequenti","q":[["Il lettore è gratuito?","Sì, il player è gratuito. È firmato senza Apple Developer ID, quindi macOS chiede una volta di confermarne l’apertura."],["Quali formati sono supportati?","MP3, FLAC, WAV, AIFF, AAC, M4A (AAC e ALAC), CAF, W64, M4B, l’audio dei video MP4 e MOV e le immagini CUE."],["Come aggiorno a una nuova versione?","Il player cerca da solo gli aggiornamenti e mostra le novità: fai clic su «Scarica e installa», poi sostituisci l’app in Applicazioni. Libreria e impostazioni vengono conservate."],["macOS dice che lo sviluppatore non è verificato, cosa faccio?","Apri Impostazioni di Sistema → Privacy e sicurezza, scorri in basso, fai clic su «Apri comunque» e conferma con la password. Se macOS dice che l’app è danneggiata, esegui nel Terminale: xattr -dr com.apple.quarantine \"/Applications/DONSKIKH Media Player.app\". Basta farlo una volta."]],"report":"Segnala un errore","dlMac":"Scarica per macOS"},
tr: {"name":"Türkçe","code":"TR","nav":["Özellikler","Kurulum","Kılavuz","Sürümler","SSS"],"dl":"İndir","menu":"Menü","lang":"Dil","ver":"Sürüm","relDate":"YAYIN TARİHİ","h1a":"Sadece dinle.","h1b":"Fazlası yok.","sub":"DONSKIKH Media Player, macOS için hafif bir müzik oynatıcıdır. [Oynatıcınızı farklı kılan şey hakkında bir cümle.]","other":"Nasıl kurulur","size":"7.5 MB","free":"Ücretsiz","subs":"Şimdi çalıyor","playlist":"Çalma listesi","fTitle":"Oynatıcı neler yapabilir","fSub":"Her kart kılavuzun ayrıntılı bölümüne götürür.","f":[["Tüm yaygın biçimler","See the guide for details."],["Çalma listeleri","Bir klasör sürükleyin, oynatıcı sırayı oluştursun. Kaydet ve tekrarla."],["Kapaklar ve etiketler","See the guide for details."],["Ekolayzer","See the guide for details."],["Mac medya tuşları","See the guide for details."],["Kısayol tuşları","Tüm kontrol klavyeden. Liste kılavuzda."]],"iTitle":"Bir dakikada kurulum","steps":[[".dmg indirin","“macOS için indir”e tıklayın, .dmg dosyası inecek."],["Uygulamalar’a taşıyın","Simgeyi Uygulamalar klasörüne sürükleyin."],["İlk açılış","Oynatıcıyı açın. macOS engellerse: Sistem Ayarları → Gizlilik ve Güvenlik → “Yine de Aç”. Bunu bir kez yapmanız yeterli."],["Hazır","Oynatıcı Launchpad’de görünür."]],"req":"Gereksinimler","checksum":"1329d0850b7c3fc3ccf538cbb0c02d2f49366d32c5ee327046676ddb4a184b4e","reqv":"macOS 14+","gMenu":["İlk açılış","Dosya ve klasör açma","Çalma listeleri","Kapaklar ve etiketler","Ekolayzer ve ses","Kısayol tuşları","Ayarlar ve temalar","Sorun giderme"],"gP":"Kurulumdan sonra oynatıcıyı Launchpad’den veya Uygulamalar klasöründen açın. Pencereye bir dosya veya klasör sürükleyin, çalma listesi kendiliğinden oluşur. [Her bölümün tam metni buraya gelecek.]","gTip":"İpucu: klasörleri Finder'dan doğrudan oynatıcı penceresine sürükleyin. İlk açılışta macOS oynatıcıyı engellerse Gizlilik ve Güvenlik ayarlarında “Yine de Aç”a tıklayın.","kTitle":"Kısayol tuşları","k":[["Oynat / duraklat","Boşluk"],["5 saniye sar","← / →"],["Ses","↑ / ↓"],["Karıştır","S"],["Sonraki parça","N"],["Dosya aç","⌘ + O"]],"cTitle":"Sürüm geçmişi","current":"Güncel","added":"Oynatıcı içinden güncellemeler, hot cue ve döngüler, Rekordbox ve Serato DJ'e aktarma","fixed":"Finder'a sürüklemek dosyayı kopyalar; 5.1/7.1 ses; karışık çalma; nadir çökmeler","prev":"See the guide for details.","archive":"Arşiv","qTitle":"Sık sorulan sorular","q":[["Oynatıcı ücretsiz mi?","Evet, oynatıcı ücretsiz. Apple Developer ID olmadan imzalandığı için macOS açılışı bir kez onaylamanızı ister."],["Hangi biçimler destekleniyor?","MP3, FLAC, WAV, AIFF, AAC, M4A (AAC ve ALAC), CAF, W64, M4B, MP4 ve MOV videolarının sesi ve CUE görüntüleri."],["Yeni sürüme nasıl güncellerim?","Oynatıcı güncellemeleri kendisi denetler ve yenilikleri gösterir: “İndir ve yükle”ye tıklayın, ardından Uygulamalar'daki uygulamayı değiştirin. Kitaplık ve ayarlar korunur."],["macOS geliştiricinin doğrulanamadığını söylüyor, ne yapmalıyım?","Sistem Ayarları → Gizlilik ve Güvenlik'i açın, aşağı kaydırın, “Yine de Aç”a tıklayın ve parolanızla onaylayın. macOS uygulamanın hasarlı olduğunu söylerse Terminal'de çalıştırın: xattr -dr com.apple.quarantine \"/Applications/DONSKIKH Media Player.app\". Bunu bir kez yapmanız yeterli."]],"report":"Hata bildir","dlMac":"macOS için indir"},
zh: {"name":"中文","code":"ZH","nav":["功能","安装","指南","版本","常见问题"],"dl":"下载","menu":"菜单","lang":"语言","ver":"版本","relDate":"发布日期","h1a":"只管聆听。","h1b":"没有多余。","sub":"DONSKIKH Media Player 是一款适用于 macOS 的轻量音乐播放器。[用一句话说明你的播放器有何不同。]","other":"如何安装","size":"7.5 MB","free":"免费","subs":"正在播放","playlist":"播放列表","fTitle":"播放器能做什么","fSub":"每张卡片都会跳转到指南中的详细章节。","f":[["支持常见格式","See the guide for details."],["播放列表","拖入文件夹即可生成队列，支持保存和循环。"],["封面与标签","See the guide for details."],["均衡器","See the guide for details."],["Mac 媒体键","See the guide for details."],["快捷键","全部操作均可用键盘完成，列表见指南。"]],"iTitle":"一分钟完成安装","steps":[["下载 .dmg","点击“下载 macOS 版”获取 .dmg 文件。"],["移到“应用程序”","把播放器图标拖到“应用程序”文件夹。"],["首次启动","打开播放器。如果 macOS 阻止打开：系统设置 → 隐私与安全性 →“仍要打开”。只需操作一次。"],["完成","播放器会出现在启动台中。"]],"req":"系统要求","checksum":"1329d0850b7c3fc3ccf538cbb0c02d2f49366d32c5ee327046676ddb4a184b4e","reqv":"macOS 14+","gMenu":["首次启动","打开文件和文件夹","播放列表","封面与标签","均衡器与声音","快捷键","设置与主题","故障排除"],"gP":"安装后从启动台或“应用程序”文件夹打开播放器。把文件或文件夹拖进窗口，播放器会自动生成播放列表。[这里将放置每个章节的完整内容。]","gTip":"提示：可以把文件夹从访达直接拖进播放器窗口。如果首次启动时 macOS 阻止播放器，请在“隐私与安全性”中点按“仍要打开”。","kTitle":"快捷键","k":[["播放 / 暂停","空格"],["快进 / 快退 5 秒","← / →"],["音量","↑ / ↓"],["随机播放","S"],["下一首","N"],["打开文件","⌘ + O"]],"cTitle":"更新历史","current":"最新","added":"播放器内更新、热标记与循环、导出到 Rekordbox 和 Serato DJ","fixed":"拖到访达会复制文件；5.1/7.1 音频；随机播放；罕见崩溃","prev":"See the guide for details.","archive":"历史版本","qTitle":"常见问题","q":[["播放器免费吗？","是的，播放器免费。它没有使用 Apple Developer ID 签名，所以 macOS 会在首次打开时请您确认一次。"],["支持哪些格式？","MP3、FLAC、WAV、AIFF、AAC、M4A（AAC 和 ALAC）、CAF、W64、M4B、MP4 和 MOV 视频中的音频，以及 CUE 映像。"],["如何升级到新版本？","播放器会自动检查更新并显示新内容：点按“下载并安装”，然后替换“应用程序”中的应用。资料库和设置会保留。"],["macOS 提示无法验证开发者怎么办？","打开系统设置 → 隐私与安全性，向下滚动，点按“仍要打开”并输入密码确认。如果 macOS 提示应用已损坏，请在终端中运行：xattr -dr com.apple.quarantine \"/Applications/DONSKIKH Media Player.app\"。只需操作一次。"]],"report":"报告问题","dlMac":"下载 macOS 版"},

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-lang],[data-guide],[data-faq],[data-act]");
  if (!el) { if (S.langOpen) { S.langOpen = false; render(); } return; }
  if (el.dataset.lang) { S.lang = el.dataset.lang; S.langOpen = false; try { localStorage.setItem("dmp-lang", S.lang); } catch (x) {} }

  else if (el.dataset.faq !== undefined) { var i = +el.dataset.faq; S.openQ = S.openQ === i ? -1 : i; }
  else if (el.dataset.act === "lang") { S.langOpen = !S.langOpen; }
  else if (el.dataset.act === "menu") { S.menuOpen = !S.menuOpen; S.langOpen = false; }
  else if (el.dataset.act === "close") { S.menuOpen = false; }
  render();
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && (S.langOpen || S.menuOpen)) { S.langOpen = false; S.menuOpen = false; render(); } });
